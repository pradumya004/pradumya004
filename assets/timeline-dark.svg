<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Experience: 2025 GetMax Solutions, built getmaxhealthcare.com. 2026 SpringWorks, SDE-1, backend automation, 148 merged PRs. Now open to remote.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: #f5f5f7; } .fg2 { fill: #a1a1a6; } .fg3 { fill: #6e6e73; }
    .rise { transform-box: fill-box; animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
    .fade { transform-box: fill-box; animation: reveal .5s ease-in-out both; }
    .draw { animation: draw 1.2s cubic-bezier(.22,1,.36,1) both; }
    .drift-a { animation: drift-a 16s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 11s ease-in-out infinite alternate; }
    .drift-c { animation: drift-c 8s ease-in-out infinite alternate; }
    @keyframes rise { from { transform: translateY(105%); filter: blur(3px); } to { transform: none; filter: blur(0); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(-12px, 6px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(18px, -10px); } }
    @keyframes drift-c { from { transform: translate(0, 0); } to { transform: translate(-6px, -8px); } }
    @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .draw { stroke-dashoffset: 0 !important; }
      .loop { display: none; }
    }
</style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2997ff"/><stop offset=".55" stop-color="#7d7aff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="gline" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#2997ff"/><stop offset=".55" stop-color="#7d7aff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#2997ff" stop-opacity="0.42"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#bf5af2" stop-opacity="0.42"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f5f5f7" fill-opacity="0.08"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="15"/></filter><clipPath id="tile"><rect width="1000" height="300" rx="18"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="1000" height="300" fill="#000000"/>
<text x="64" y="72" font-size="14" font-weight="600" letter-spacing="-.2" class="fg2 fade">Experience</text><path d="M64 128H936" stroke="#ffffff1a" stroke-width="1.5"/><path d="M64 128H936" stroke="url(#gline)" stroke-width="1.5" stroke-dasharray="872" stroke-dashoffset="872" class="draw" style="animation-delay:0.10s"/><g class="fade" style="animation-delay:0.20s"><circle cx="70.0" cy="128" r="6" fill="#000000" stroke="#2997ff" stroke-width="2"/><text x="64.0" y="180" font-size="32" font-weight="600" letter-spacing="-.8" class="fg">2025</text><text x="64.0" y="212" font-size="17" font-weight="600" letter-spacing="-.35" class="fg">GetMax Solutions</text><text x="64.0" y="240" font-size="15" letter-spacing="-.25" class="fg2">Built getmaxhealthcare.com end to end</text><text x="64.0" y="263" font-size="15" letter-spacing="-.25" class="fg2">and internal tools for US healthcare ops.</text></g><g class="fade" style="animation-delay:0.36s"><circle cx="360.6666666666667" cy="128" r="6" fill="#000000" stroke="#2997ff" stroke-width="2"/><text x="354.6666666666667" y="180" font-size="32" font-weight="600" letter-spacing="-.8" class="fg">2026</text><text x="354.6666666666667" y="212" font-size="17" font-weight="600" letter-spacing="-.35" class="fg">SpringWorks · SDE-1</text><text x="354.6666666666667" y="240" font-size="15" letter-spacing="-.25" class="fg2">Backend automation: queues, LLM routing,</text><text x="354.6666666666667" y="263" font-size="15" letter-spacing="-.25" class="fg2">WhatsApp Cloud API. 148 merged PRs.</text></g><g class="fade" style="animation-delay:0.52s"><circle cx="651.3333333333334" cy="128" r="6" fill="#000000" stroke="#bf5af2" stroke-width="2"/><circle cx="651.3333333333334" cy="128" r="6" fill="none" stroke="#bf5af2" class="loop" style="transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out 1.2s infinite"/><text x="645.3333333333334" y="180" font-size="32" font-weight="600" letter-spacing="-.8" class="fg">Now</text><text x="645.3333333333334" y="212" font-size="17" font-weight="600" letter-spacing="-.35" class="fg">Open to remote</text><text x="645.3333333333334" y="240" font-size="15" letter-spacing="-.25" class="fg2">Shipping side projects in public and</text><text x="645.3333333333334" y="263" font-size="15" letter-spacing="-.25" class="fg2">contributing to open source.</text></g>
  </g>
</svg>
