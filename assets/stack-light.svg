      <stop offset="0" stop-color="#059669"/><stop offset=".5" stop-color="#0071e3"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#0071e3" stop-opacity="0.28"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb3"><stop offset="0" stop-color="#059669" stop-opacity="0.22400000000000003"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1d1d1f" fill-opacity=".09"/></pattern>
    <clipPath id="tile"><rect width="1000" height="176" rx="28"/></clipPath>
