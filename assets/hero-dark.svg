<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Pradumya Gaurav. Backend engineer. I turn manual ops work into automated pipelines.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: #f5f5f7; } .fg2 { fill: #a1a1a6; } .fg3 { fill: #6e6e73; }
    .rise { transform-box: fill-box; animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
    .fade { transform-box: fill-box; animation: reveal .5s ease-in-out both; }
    .draw { animation: draw 1.2s cubic-bezier(.22,1,.36,1) both; }
    .drift-a { animation: drift-a 16s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 11s ease-in-out infinite alternate; }
    .drift-c { animation: drift-c 8s ease-in-out infinite alternate; }
    @keyframes rise { from { transform: translateY(105%); filter: blur(3px); } to { transform: none; filter: blur(0); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(-12px, 6px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(18px, -10px); } }
    @keyframes drift-c { from { transform: translate(0, 0); } to { transform: translate(-6px, -8px); } }
    
    @keyframes pulse { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 70% { transform: translateX(872px); opacity: 1; } 76%, 100% { transform: translateX(872px); opacity: 0; } }
    @keyframes sheen { 0% { transform: skewX(-20deg) translateX(0); } 30%, 100% { transform: skewX(-20deg) translateX(1100px); } }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .draw { stroke-dashoffset: 0 !important; }
      .loop { display: none; }
    }
</style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2997ff"/><stop offset=".55" stop-color="#7d7aff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="gline" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#2997ff"/><stop offset=".55" stop-color="#7d7aff"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#2997ff" stop-opacity="0.42"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#bf5af2" stop-opacity="0.42"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f5f5f7" fill-opacity="0.08"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="15"/></filter><clipPath id="tile"><rect width="1000" height="520" rx="18"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="1000" height="520" fill="#000000"/>

    <g class="drift-a"><rect x="-40" y="-40" width="1080" height="600" fill="url(#dots)"/></g>
    <g class="drift-b"><ellipse cx="830" cy="110" rx="380" ry="260" fill="url(#orb1)"/></g>
    <g class="drift-c"><ellipse cx="620" cy="460" rx="320" ry="190" fill="url(#orb2)"/></g>

    <g class="fade">
      <text x="64" y="94" font-size="21" font-weight="600" class="fg" letter-spacing="-.2">Pradumya Gaurav</text>
      <text x="64" y="122" font-size="15" class="fg2" letter-spacing="-.2">Backend engineer · Node.js, queues, LLMs · Bengaluru</text>
    </g>
    <clipPath id="l0"><rect x="0" y="152" width="1000" height="82"/></clipPath><g clip-path="url(#l0)"><text x="64" y="214" font-size="62" font-weight="600" letter-spacing="-1.4" class="fg rise" style="animation-delay:0.10s">I turn manual ops work</text></g><clipPath id="l1"><rect x="0" y="224" width="1000" height="82"/></clipPath><g clip-path="url(#l1)"><text x="64" y="286" font-size="62" font-weight="600" letter-spacing="-1.4" fill="url(#grad)" class="rise" style="animation-delay:0.18s">into automated pipelines.</text></g>
    
    <clipPath id="sheenclip"><text x="64" y="286" font-size="62" font-weight="600" letter-spacing="-1.4">into automated pipelines.</text></clipPath>
    <g clip-path="url(#sheenclip)" class="loop"><rect x="-200" y="200" width="140" height="110" fill="#ffffff" opacity=".35" style="animation: sheen 7s cubic-bezier(.22,1,.36,1) 1.2s infinite both"/></g>
    <text x="64" y="352" font-size="19" class="fg2 fade" letter-spacing="-.3" style="animation-delay:0.30s">Production systems where the busywork runs itself, and people only see what needs a human.</text>

    <path d="M64 436H936" stroke="url(#gline)" stroke-width="1.5" stroke-dasharray="872" stroke-dashoffset="872" class="draw" style="animation-delay:0.45s"/>
    <g class="loop"><circle cx="64" cy="436" r="4" fill="#2997ff" style="animation: pulse 4.2s cubic-bezier(.22,1,.36,1) 1.6s infinite both"/></g>
    <g class="fade" style="animation-delay:0.55s"><rect x="64" y="422" width="82" height="29" rx="14.5" fill="#ffffff12" stroke="#ffffff24"/><text x="105" y="441.2" text-anchor="middle" font-size="13" class="mono fg">inbound</text></g><g class="fade" style="animation-delay:0.59s"><rect x="249" y="422" width="66" height="29" rx="14.5" fill="#ffffff12" stroke="#ffffff24"/><text x="282" y="441.2" text-anchor="middle" font-size="13" class="mono fg">queue</text></g><g class="fade" style="animation-delay:0.63s"><rect x="475" y="422" width="50" height="29" rx="14.5" fill="#ffffff12" stroke="#ffffff24"/><text x="500" y="441.2" text-anchor="middle" font-size="13" class="mono fg">llm</text></g><g class="fade" style="animation-delay:0.67s"><rect x="681" y="422" width="74" height="29" rx="14.5" fill="#ffffff12" stroke="#ffffff24"/><text x="718" y="441.2" text-anchor="middle" font-size="13" class="mono fg">action</text></g><g class="fade" style="animation-delay:0.71s"><rect x="878" y="422" width="58" height="29" rx="14.5" fill="#ffffff12" stroke="url(#gline)"/><text x="907" y="441.2" text-anchor="middle" font-size="13" class="mono fg">done</text></g>
    
  </g>
</svg>
