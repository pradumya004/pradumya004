<svg fill="none" width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .hero {
          width: 100%;
          height: 350px;
          background: #0a0a0f;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          font-family: 'Inter', sans-serif;
        }

        .glow-top {
          position: absolute;
          top: -120px;
          left: 50%;
          transform: translateX(-50%);
          width: 600px;
          height: 300px;
          background: radial-gradient(ellipse, rgba(168, 85, 247, 0.15) 0%, rgba(236, 72, 153, 0.08) 40%, transparent 70%);
          animation: breathe 6s ease-in-out infinite;
        }

        .glow-left {
          position: absolute;
          bottom: -80px;
          left: -100px;
          width: 300px;
          height: 300px;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
          animation: breathe 8s ease-in-out infinite reverse;
        }

        .glow-right {
          position: absolute;
          top: 0;
          right: -80px;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(236, 72, 153, 0.08) 0%, transparent 70%);
          animation: breathe 7s ease-in-out 2s infinite;
        }

        @keyframes breathe {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }

        .line-top, .line-bottom {
          position: absolute;
          left: 0;
          width: 100%;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3), transparent);
        }
        .line-top { top: 0; }
        .line-bottom { bottom: 0; }

        .dot {
          position: absolute;
          width: 2px;
          height: 2px;
          border-radius: 50%;
          background: rgba(168, 85, 247, 0.4);
          animation: twinkle 4s ease-in-out infinite;
        }
        .dot:nth-child(1) { top: 20%; left: 8%; animation-delay: 0s; }
        .dot:nth-child(2) { top: 60%; left: 15%; animation-delay: 1.2s; }
        .dot:nth-child(3) { top: 30%; right: 12%; animation-delay: 0.6s; background: rgba(236, 72, 153, 0.4); }
        .dot:nth-child(4) { top: 75%; right: 20%; animation-delay: 2s; }
        .dot:nth-child(5) { top: 45%; left: 85%; animation-delay: 0.3s; background: rgba(236, 72, 153, 0.3); }
        .dot:nth-child(6) { top: 15%; left: 45%; animation-delay: 1.8s; }

        @keyframes twinkle {
          0%, 100% { opacity: 0; }
          50% { opacity: 1; }
        }

        .content {
          position: relative;
          z-index: 2;
          text-align: center;
        }

        .greeting {
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          font-weight: 400;
          color: rgba(168, 85, 247, 0.8);
          letter-spacing: 6px;
          text-transform: uppercase;
          margin-bottom: 16px;
          animation: fadeIn 1s ease-out forwards;
          opacity: 0;
        }

        .name {
          font-size: 64px;
          font-weight: 900;
          color: #ffffff;
          letter-spacing: -3px;
          line-height: 1;
          margin-bottom: 16px;
          animation: fadeIn 1s ease-out 0.2s forwards;
          opacity: 0;
        }

        .name .highlight {
          background: linear-gradient(135deg, #a855f7, #ec4899);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .tags {
          display: flex;
          gap: 8px;
          justify-content: center;
          align-items: center;
          margin-top: 20px;
          animation: fadeIn 1s ease-out 0.4s forwards;
          opacity: 0;
        }

        .tag {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: rgba(255, 255, 255, 0.5);
          padding: 5px 14px;
          border: 1px solid rgba(168, 85, 247, 0.2);
          border-radius: 100px;
          background: rgba(168, 85, 247, 0.05);
        }

        .tag-sep {
          color: rgba(168, 85, 247, 0.3);
          font-size: 10px;
        }

        .status {
          display: flex;
          align-items: center;
          gap: 6px;
          justify-content: center;
          margin-top: 18px;
          animation: fadeIn 1s ease-out 0.6s forwards;
          opacity: 0;
        }

        .status-dot {
          width: 6px;
          height: 6px;
          background: #22c55e;
          border-radius: 50%;
          animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
          50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
        }

        .status-text {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: rgba(255, 255, 255, 0.35);
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
      </style>

      <div class="hero">
        <div class="glow-top"></div>
        <div class="glow-left"></div>
        <div class="glow-right"></div>
        <div class="line-top"></div>
        <div class="line-bottom"></div>

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

        <div class="content">
          <div class="greeting">Hello, I'm</div>
          <div class="name">Pradumya <span class="highlight">Gaurav</span></div>
          <div class="tags">
            <span class="tag">Full-Stack Developer</span>
            <span class="tag-sep">·</span>
            <span class="tag">Digital Craftsman</span>
          </div>
          <div class="status">
            <div class="status-dot"></div>
            <span class="status-text">shipping code @ Springworks</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
