<svg fill="none" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .hero {
          width: 100%;
          height: 400px;
          background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 25%, #16213e 50%, #0a0a0a 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          font-family: 'Space Grotesk', sans-serif;
        }

        .grid-bg {
          position: absolute;
          top: 0; left: 0;
          width: 100%; height: 100%;
          background-image: 
            linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
          background-size: 40px 40px;
          animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
          0% { transform: translate(0, 0); }
          100% { transform: translate(40px, 40px); }
        }

        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          opacity: 0.4;
          animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
          width: 300px; height: 300px;
          background: #6366f1;
          top: -50px; left: -50px;
          animation-delay: 0s;
        }

        .orb-2 {
          width: 250px; height: 250px;
          background: #ec4899;
          bottom: -50px; right: -50px;
          animation-delay: -4s;
        }

        .orb-3 {
          width: 200px; height: 200px;
          background: #06b6d4;
          top: 50%; left: 50%;
          transform: translate(-50%, -50%);
          animation-delay: -2s;
        }

        @keyframes float {
          0%, 100% { transform: translate(0, 0) scale(1); }
          25% { transform: translate(20px, -20px) scale(1.05); }
          50% { transform: translate(-10px, 15px) scale(0.95); }
          75% { transform: translate(15px, 10px) scale(1.02); }
        }

        .name {
          font-size: 56px;
          font-weight: 700;
          background: linear-gradient(135deg, #fff 0%, #c7d2fe 50%, #a78bfa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          letter-spacing: -2px;
          position: relative;
          z-index: 2;
          animation: fadeUp 1s ease-out forwards;
          opacity: 0;
        }

        .tagline {
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          color: #a78bfa;
          letter-spacing: 4px;
          text-transform: uppercase;
          margin-top: 12px;
          position: relative;
          z-index: 2;
          animation: fadeUp 1s ease-out 0.3s forwards;
          opacity: 0;
        }

        .status-bar {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-top: 24px;
          padding: 8px 20px;
          background: rgba(99, 102, 241, 0.1);
          border: 1px solid rgba(99, 102, 241, 0.2);
          border-radius: 100px;
          position: relative;
          z-index: 2;
          animation: fadeUp 1s ease-out 0.6s forwards;
          opacity: 0;
        }

        .pulse-dot {
          width: 8px; height: 8px;
          background: #34d399;
          border-radius: 50%;
          animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
          50% { opacity: 0.8; box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
        }

        .status-text {
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          color: #94a3b8;
        }

        .status-text span {
          color: #34d399;
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .particles {
          position: absolute;
          width: 100%; height: 100%;
          z-index: 1;
        }

        .particle {
          position: absolute;
          width: 2px; height: 2px;
          background: #6366f1;
          border-radius: 50%;
          animation: twinkle 3s ease-in-out infinite;
        }

        .particle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 25%; left: 80%; animation-delay: 0.5s; }
        .particle:nth-child(3) { top: 60%; left: 20%; animation-delay: 1s; }
        .particle:nth-child(4) { top: 70%; left: 70%; animation-delay: 1.5s; }
        .particle:nth-child(5) { top: 40%; left: 50%; animation-delay: 2s; }
        .particle:nth-child(6) { top: 80%; left: 40%; animation-delay: 0.3s; }
        .particle:nth-child(7) { top: 10%; left: 60%; animation-delay: 1.2s; }
        .particle:nth-child(8) { top: 50%; left: 90%; animation-delay: 0.8s; }

        @keyframes twinkle {
          0%, 100% { opacity: 0; transform: scale(0); }
          50% { opacity: 1; transform: scale(1.5); }
        }

        .corner-accent {
          position: absolute;
          width: 60px; height: 60px;
          border: 1px solid rgba(99, 102, 241, 0.3);
          z-index: 2;
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
      </style>

      <div class="hero">
        <div class="grid-bg"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        
        <div class="particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>

        <div class="corner-accent corner-tl"></div>
        <div class="corner-accent corner-tr"></div>
        <div class="corner-accent corner-bl"></div>
        <div class="corner-accent corner-br"></div>

        <div class="name">PRADUMYA</div>
        <div class="tagline">full stack developer · builder · shipper</div>
        <div class="status-bar">
          <div class="pulse-dot"></div>
          <div class="status-text">currently building @ <span>Springworks</span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
