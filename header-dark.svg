<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Pradumya Gaurav. Backend engineer. I turn manual ops work into automated pipelines.">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { fill: #e6edf3; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    .line { fill: #8b949e; font-size: 17px; }
    .tag { fill: #2dd4bf; font-size: 13px; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .node-on { fill: #0f2f2b; stroke: #2dd4bf; stroke-width: 1; }
    .label { fill: #c9d1d9; font-size: 12px; }
    .wire { stroke: #30363d; stroke-width: 1.5; }
    .dot { fill: #2dd4bf; animation: travel 3.6s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateX(264px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0; } }
  </style>

  <text x="40" y="78" class="sans name">Pradumya Gaurav</text>
  <text x="40" y="112" class="sans line">Backend engineer. I turn manual ops work</text>
  <text x="40" y="136" class="sans line">into automated pipelines.</text>
  <text x="40" y="170" class="mono tag">node.js · bullmq · redis · llms · react</text>

  <g transform="translate(520 82)">
    <line x1="64" y1="18" x2="88" y2="18" class="wire"/>
    <line x1="152" y1="18" x2="176" y2="18" class="wire"/>
    <line x1="240" y1="18" x2="264" y2="18" class="wire"/>
    <circle cx="32" cy="18" r="3.5" class="dot"/>
    <rect x="0" y="0" width="64" height="36" rx="8" class="node"/>
    <rect x="88" y="0" width="64" height="36" rx="8" class="node"/>
    <rect x="176" y="0" width="64" height="36" rx="8" class="node"/>
    <rect x="264" y="0" width="64" height="36" rx="8" class="node-on"/>
    <text x="32" y="22" text-anchor="middle" class="mono label">manual</text>
    <text x="120" y="22" text-anchor="middle" class="mono label">queue</text>
    <text x="208" y="22" text-anchor="middle" class="mono label">llm</text>
    <text x="296" y="22" text-anchor="middle" class="mono label">done</text>
  </g>
</svg>
