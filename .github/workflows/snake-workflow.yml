name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Game from GitHub Contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pradumya004
          outputs: |
            dist/github-snake.svg?color_snake=a855f7&color_dots=#0a0a0f,#2d1b4e,#5b2d8e,#a855f7,#ec4899
            dist/github-snake-dark.svg?palette=github-dark&color_snake=a855f7&color_dots=#0a0a0f,#2d1b4e,#5b2d8e,#a855f7,#ec4899

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
